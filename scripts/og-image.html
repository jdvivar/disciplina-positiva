<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #1b4332;          /* sage-900 */
        --sage-100: #d8f3dc;
        --sage-200: #b7e4c7;
        --sage-300: #95d5b2;
        --sage-500: #52796f;
        --sage-600: #40916c;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1200px;
        height: 630px;
        background: var(--bg);
        font-family: 'Inter', sans-serif;
      }
      .canvas {
        width: 1200px;
        height: 630px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 100px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 64px;
        width: 100%;
        height: 100%;
      }
      .text { flex: 1; }
      .eyebrow {
        font-size: 16px;
        font-weight: 500;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--sage-200);
        margin-bottom: 20px;
      }
      h1 {
        font-family: 'Fraunces', serif;
        font-weight: 700;
        font-size: 72px;
        line-height: 1.05;
        color: var(--sage-100);
        margin-bottom: 24px;
      }
      .tagline {
        font-size: 22px;
        line-height: 1.5;
        color: var(--sage-200);
        max-width: 460px;
        margin-bottom: 28px;
      }
      .credits {
        font-size: 14px;
        line-height: 1.6;
        color: var(--sage-500);
        margin-bottom: 14px;
      }
      .url {
        font-size: 16px;
        font-weight: 500;
        letter-spacing: 0.01em;
        color: var(--sage-300);
      }
      .badge {
        flex-shrink: 0;
        width: 200px;
        height: 200px;
        background: rgba(64, 145, 108, 0.15); /* sage-600/15 */
        border-radius: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .badge svg { width: 125px; height: 125px; }
    </style>
  </head>
  <body>
    <div class="canvas">
      <div class="row">
        <div class="text">
          <p class="eyebrow">Guía interactiva para familias</p>
          <h1>Disciplina<br />Positiva</h1>
          <p class="tagline">Aprende a criar con respeto, calidez y sin violencia. A tu propio ritmo.</p>
          <p class="credits">
            Basado en el manual de la Dra. Joan E. Durrant<br />
            Save the Children / ACHNU Chile
          </p>
          <p class="url">disciplina-positiva.danielvivar.com</p>
        </div>

        <div class="badge">
          <svg viewBox="6 10 68 60" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 56C12 56 18 46 28 42C34 40 38 39 42 39C46 39 52 40 58 44C62 47 64 52 62 56C58 62 48 64 40 64C30 64 20 62 12 56Z" fill="#52796f"/>
            <path d="M40 39V14" stroke="#40916c" stroke-width="4" stroke-linecap="round"/>
            <path d="M40 28C34 22 24 19 21 22C18 25 22 34 30 34C35 34 38 31 40 28Z" fill="#40916c"/>
            <path d="M40 20C46 14 56 11 59 14C62 17 58 26 50 26C45 26 42 23 40 20Z" fill="#b7e4c7"/>
          </svg>
        </div>
      </div>
    </div>
  </body>
</html>
